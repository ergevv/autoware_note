<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Route、Path、Trajectory 与 Lanelet / Route Section 的关系</title>
  <desc id="desc">一张面向 Autoware Mission Planner 教学的中文信息图，解释车道、车道段、Route、Path、Trajectory 的区别与联系。</desc>
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <linearGradient id="roadFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fbfcfe; }
      .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; filter: url(#softShadow); }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #111827; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 22px; fill: #475569; }
      .h2 { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 27px; font-weight: 800; fill: #111827; }
      .label { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 20px; fill: #263238; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; fill: #475569; }
      .tiny { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; fill: #475569; }
      .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size: 17px; fill: #334155; }
      .road { fill: url(#roadFill); stroke: #94a3b8; stroke-width: 3; }
      .laneEdge { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
      .laneDash { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 18 16; }
      .laneletBox { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; opacity: 0.55; }
      .routeFill { fill: #bfdbfe; stroke: #2563eb; stroke-width: 3; opacity: 0.9; }
      .sectionFill { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; opacity: 0.72; }
      .pathLine { fill: none; stroke: #ea580c; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .trajLine { fill: none; stroke: #7c3aed; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 16; }
      .callout { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .routeBadge { fill: #2563eb; }
      .pathBadge { fill: #ea580c; }
      .trajBadge { fill: #7c3aed; }
      .laneBadge { fill: #0f766e; }
      .sectionBadge { fill: #16a34a; }
      .whiteText { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #ffffff; }
      .step { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <text class="title" x="70" y="68">Route、Path、Trajectory：从车道级选择到带时间轨迹</text>
  <text class="subtitle" x="72" y="108">Mission Planner 先回答“走哪些车道”，后续模块再回答“车道内怎么走、每一刻怎么走”。</text>

  <rect class="panel" x="52" y="140" width="1035" height="690" rx="8"/>
  <rect class="panel" x="1115" y="140" width="430" height="690" rx="8"/>

  <text class="h2" x="84" y="188">地图基底：Lane / Lanelet / Route Section</text>

  <!-- Road body -->
  <path class="road" d="M 110 365 C 300 235, 465 235, 620 345 C 790 465, 885 520, 1035 420 L 1035 665 C 860 760, 700 700, 545 585 C 385 468, 280 460, 110 605 Z"/>
  <path class="laneEdge" d="M 110 365 C 300 235, 465 235, 620 345 C 790 465, 885 520, 1035 420"/>
  <path class="laneEdge" d="M 110 485 C 300 355, 445 350, 590 455 C 755 575, 870 625, 1035 535"/>
  <path class="laneEdge" d="M 110 605 C 280 460, 385 468, 545 585 C 700 700, 860 760, 1035 665"/>
  <path class="laneDash" d="M 110 425 C 300 295, 455 292, 605 400 C 772 520, 878 572, 1035 477"/>
  <path class="laneDash" d="M 110 545 C 290 408, 415 412, 568 520 C 730 642, 868 690, 1035 600"/>

  <!-- Lanelet slices -->
  <path class="laneletBox" d="M 185 326 C 250 292, 300 285, 356 301 L 338 416 C 284 401, 236 410, 174 448 Z"/>
  <path class="laneletBox" d="M 174 448 C 236 410, 284 401, 338 416 L 321 531 C 268 520, 223 536, 162 574 Z"/>
  <path class="laneletBox" d="M 365 305 C 438 318, 497 352, 555 397 L 520 507 C 463 463, 410 431, 338 416 Z"/>
  <path class="laneletBox" d="M 338 416 C 410 431, 463 463, 520 507 L 486 622 C 430 580, 374 546, 321 531 Z"/>

  <!-- Route section and preferred route -->
  <path class="sectionFill" d="M 555 397 C 628 455, 690 496, 755 532 L 701 640 C 630 600, 557 554, 520 507 Z"/>
  <path class="sectionFill" d="M 520 507 C 557 554, 630 600, 701 640 L 648 724 C 582 699, 528 658, 486 622 Z"/>
  <path class="routeFill" d="M 555 397 C 628 455, 690 496, 755 532 L 701 640 C 630 600, 557 554, 520 507 Z"/>
  <path class="routeFill" d="M 755 532 C 842 575, 940 572, 1035 535 L 1035 665 C 899 729, 790 694, 701 640 Z"/>

  <!-- Center line, path, trajectory -->
  <path d="M 150 515 C 300 390, 428 390, 570 495 C 720 608, 850 666, 1005 585" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 10"/>
  <path class="pathLine" d="M 150 515 C 300 390, 428 390, 570 495 C 720 608, 850 666, 1005 585"/>
  <path class="trajLine" d="M 150 515 C 298 392, 429 389, 570 495 C 718 606, 848 665, 1005 585"/>

  <!-- Trajectory time stamps -->
  <g>
    <circle cx="190" cy="485" r="12" fill="#7c3aed"/>
    <circle cx="325" cy="408" r="12" fill="#7c3aed"/>
    <circle cx="470" cy="430" r="12" fill="#7c3aed"/>
    <circle cx="610" cy="525" r="12" fill="#7c3aed"/>
    <circle cx="760" cy="623" r="12" fill="#7c3aed"/>
    <circle cx="915" cy="631" r="12" fill="#7c3aed"/>
    <text class="tiny" x="178" y="462">t0</text>
    <text class="tiny" x="313" y="385">t1</text>
    <text class="tiny" x="458" y="407">t2</text>
    <text class="tiny" x="598" y="502">t3</text>
    <text class="tiny" x="748" y="600">t4</text>
    <text class="tiny" x="903" y="608">t5</text>
  </g>

  <!-- Direction arrows -->
  <path d="M 240 455 C 310 410, 380 397, 450 426" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrowDark)"/>
  <path d="M 685 584 C 755 625, 820 646, 895 629" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrowDark)"/>

  <!-- Callouts -->
  <g>
    <rect class="callout" x="92" y="212" width="290" height="96" rx="8"/>
    <circle class="laneBadge" cx="122" cy="244" r="16"/>
    <text class="whiteText" x="113" y="251">1</text>
    <text class="label" x="150" y="248">Lane / 车道</text>
    <text class="small" x="150" y="278">一条连续可行驶通道，可由多个</text>
    <text class="small" x="150" y="302">lanelet 沿纵向拼接出来。</text>
  </g>

  <g>
    <rect class="callout" x="418" y="212" width="315" height="96" rx="8"/>
    <circle class="laneBadge" cx="448" cy="244" r="16"/>
    <text class="whiteText" x="439" y="251">2</text>
    <text class="label" x="476" y="248">Lanelet / 车道段</text>
    <text class="small" x="476" y="278">有方向、有左右边界、有规则的</text>
    <text class="small" x="476" y="302">小段车道区域。</text>
  </g>

  <g>
    <rect class="callout" x="768" y="212" width="290" height="96" rx="8"/>
    <circle class="sectionBadge" cx="798" cy="244" r="16"/>
    <text class="whiteText" x="789" y="251">3</text>
    <text class="label" x="826" y="248">Route Section</text>
    <text class="small" x="826" y="278">preferred lanelet + 同一横向切片</text>
    <text class="small" x="826" y="302">内可用 primitives。</text>
  </g>

  <path d="M 254 309 L 244 376" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowDark)"/>
  <path d="M 548 309 L 451 419" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowDark)"/>
  <path d="M 915 309 L 670 512" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowDark)"/>

  <!-- Route/Path/Trajectory legend -->
  <g>
    <rect x="95" y="692" width="305" height="104" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle class="routeBadge" cx="128" cy="724" r="15"/>
    <text class="whiteText" x="119" y="731">R</text>
    <text class="label" x="154" y="728">Route</text>
    <text class="small" x="154" y="758">车道级路线：经过哪些 lanelet /</text>
    <text class="small" x="154" y="782">route sections。不是给控制器跟踪的线。</text>
  </g>

  <g>
    <rect x="430" y="692" width="305" height="104" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle class="pathBadge" cx="463" cy="724" r="15"/>
    <text class="whiteText" x="455" y="731">P</text>
    <text class="label" x="489" y="728">Path</text>
    <text class="small" x="489" y="758">车道内几何路径：一串空间点，</text>
    <text class="small" x="489" y="782">通常描述“从哪里走”。</text>
  </g>

  <g>
    <rect x="765" y="692" width="305" height="104" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <circle class="trajBadge" cx="798" cy="724" r="15"/>
    <text class="whiteText" x="790" y="731">T</text>
    <text class="label" x="824" y="728">Trajectory</text>
    <text class="small" x="824" y="758">带时间 / 速度 / 姿态的路径点，</text>
    <text class="small" x="824" y="782">回答“每一刻怎么走”。</text>
  </g>

  <!-- Right-side flow -->
  <text class="h2" x="1150" y="188">从粗到细的规划链路</text>
  <text class="small" x="1152" y="221">同一条驾驶任务会被逐层细化：</text>

  <g transform="translate(1150,250)">
    <rect class="step" x="0" y="0" width="350" height="78" rx="8"/>
    <text class="label" x="24" y="31">1. Goal + Current Pose</text>
    <text class="small" x="24" y="58">连续世界中的起点和目标点</text>

    <path d="M 175 82 L 175 117" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrowDark)"/>

    <rect class="step" x="0" y="122" width="350" height="88" rx="8" fill="#eff6ff"/>
    <text class="label" x="24" y="154">2. Mission Planner 输出 Route</text>
    <text class="small" x="24" y="181">Pose -> Lanelet -> Graph -> Shortest Path</text>
    <text class="small" x="24" y="204">结果是车道级可行驶走廊</text>

    <path d="M 175 214 L 175 249" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <rect class="step" x="0" y="254" width="350" height="88" rx="8" fill="#fff7ed"/>
    <text class="label" x="24" y="286">3. Behavior Path Planner 输出 Path</text>
    <text class="small" x="24" y="313">在 route 允许范围内做换道、避障、</text>
    <text class="small" x="24" y="336">靠边停车等几何决策</text>

    <path d="M 175 346 L 175 381" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrowOrange)"/>

    <rect class="step" x="0" y="386" width="350" height="88" rx="8" fill="#f5f3ff"/>
    <text class="label" x="24" y="418">4. Motion / Smoother 输出 Trajectory</text>
    <text class="small" x="24" y="445">给 path 点补速度、时间、加速度等</text>
    <text class="small" x="24" y="468">让控制器可以跟踪</text>
  </g>

  <g>
    <rect x="1150" y="752" width="350" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="mono" x="1174" y="786">Goal -> Route -> Path -> Trajectory -> Control</text>
  </g>

  <text class="tiny" x="70" y="866">读图口诀：Route 选车道范围，Path 画车道内曲线，Trajectory 给曲线加时间和速度；Lanelet 是地图图搜索的基本车道段。</text>
</svg>
